name: Keep backend warm

# Render's free plan stops an idle web service after ~15 minutes; a ping every 10 minutes keeps it awake.
# Optional repo variable BACKEND_URL overrides the address.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.BACKEND_URL || 'https://nuevai-backend.onrender.com' }}/health"
