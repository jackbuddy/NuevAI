name: Keep backend warm

# Free hosts sleep an idle backend (Render after ~15 minutes, Hugging Face Spaces after ~48 hours). A ping keeps it
# awake. Set the repo variable BACKEND_URL to the Space URL (https://<user>-<space>.hf.space).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.BACKEND_URL || 'https://nuevai-backend.onrender.com' }}/health"
