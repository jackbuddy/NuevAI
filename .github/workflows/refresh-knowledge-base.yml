name: Refresh calendar

# Daily unattended refresh: iCal calendar feed + the cafe's monthly lunch menus + live team-schedule sheets -> chunk -> embed -> Supabase.
# Expired events are removed automatically. The public site is crawled once and
# Nexus (behind school SSO/2FA) is refreshed by hand, both locally:
#   python run_pipeline.py --refresh-nexus
on:
  schedule:
    - cron: "30 13 * * *"      # daily 13:30 UTC (~6:30am Pacific)
  workflow_dispatch:
    inputs:
      prune:
        description: "unused"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Record index row count
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/index_guard.py before
      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NUEVAI_CALENDAR_URL: ${{ secrets.NUEVAI_CALENDAR_URL }}
        run: |
          LIVE_KINDS=team_schedule python run_pipeline.py --stages calendar,lunch,live,chunk,index
      - name: Guard - index must not shrink by more than 10%
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/index_guard.py after --max-drop 0.10
      - name: Audit data against sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NUEVAI_CALENDAR_URL: ${{ secrets.NUEVAI_CALENDAR_URL }}
        run: python scripts/audit_data.py --json data/pipeline/audit.json
      - name: Upload report and unreadable-doc list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            data/pipeline/report.json
            data/pipeline/needs_access.json
            data/pipeline/links.json
            data/pipeline/audit.json
