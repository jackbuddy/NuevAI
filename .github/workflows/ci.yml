name: CI

# py_compile, retrieval checks (read-only Supabase SELECTs + the embed function, no LLM quota), offline tests, tsc, next build.
on:
  pull_request:
  push:
    branches: [main, "auto/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANALYTICS_DISABLED: "1"
      GROQ_API_KEY: "ci-offline-dummy"      # query_server builds its Groq client at import; the offline tests never call it (no real key in CI)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pipeline.txt
      - run: pip install -r requirements.txt -r requirements-pipeline.txt
      - name: Compile every Python file
        run: python -m compileall -q -x 'node_modules|\.next' . 
      - name: Retrieval regression checks (reads the live index, read-only)
        # Secrets are not given to PRs from forks; the step is skipped there instead of failing.
        if: ${{ env.SUPABASE_URL != '' }}
        run: python eval_retrieval.py
      - name: Offline tests
        run: |
          python test_pipeline_fixes.py
          python test_resilience.py
          python test_email_ingest.py
          python test_share_ingest.py
          python test_lunch.py
          python test_insights.py
          python test_flagged.py
          python test_data_coverage.py
          python test_quality_fixes.py
          python test_calendar.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Logic tests (scripts/*.test.mjs)
        run: for f in scripts/*.test.mjs; do node --experimental-strip-types "$f" || exit 1; done
      - run: npx tsc --noEmit
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
