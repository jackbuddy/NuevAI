name: Deploy backend to Hugging Face Space

# Pushes the backend to the Space whenever backend code changes on main.
# One-time setup: repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. "username/nuevai-backend").
on:
  push:
    branches: [main]
    paths: ["query_server.py", "rag.py", "intent.py", "cache.py", "analytics.py", "requirements.txt", "deploy/hf-space/**", "scripts/push_hf_space.sh"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: ./scripts/push_hf_space.sh
